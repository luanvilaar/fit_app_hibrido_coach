resolved_this_iteration:
  - id: 'REL-001'
    severity_was: high
    resolution: 'Rollback passo 4b restaura `slug` de `store_product_audit.previous_value->>''slug''` (distinct on por produto, `order by created_at asc`) antes do `delete ... action = ''PRODUCT_DELETED''` e antes do `drop column deleted_at`. Ordem verificada no arquivo e por teste de posição. `order by ... asc` é a escolha correta: se houvesse múltiplos PRODUCT_DELETED, o mais antigo carrega o slug pré-mutilação — mas não pode haver, porque `delete_store_product` retorna cedo quando `deleted_at is not null`. Modos de falha (colisão no índice único de slug; auditoria removida manualmente) documentados no cabeçalho do rollback e no "Risco operacional" do snapshot.'
    verified_by: 'leitura do SQL + teste de ordem + verificação independente de que a reexclusão é idempotente'
  - id: 'SEC-002'
    severity_was: medium
    resolution: '`and deleted_at is null` estendido a `create_training_program_delivery`, `approve_store_product` e `submit_store_product_review`, recriadas na migration NOVA (a 20260819100000 não foi editada retroativamente para isso). Escopo confirmado por auditoria independente: os únicos gravadores das quatro FKs `on delete restrict` são checkout.ts (já bloqueia `deleted_at`), `create_training_program_delivery` (guardada), `create_store_program_version_internal` (só chamada por `approve`, guardada), `settle_store_order` e `grant_store_program_delivery` (honram pedido já pago — não devem ser guardados). `reject_store_product` e `get_coach_store_product_schedule` corretamente fora.'
    verified_by: 'diff normalizado: as três funções são idênticas às versões canônicas de 20260819100000 exceto pela única linha de guarda — sem risco de 42P13. O rollback restaura as três originais byte a byte, antes do drop da coluna.'
  - id: 'DOC-003'
    severity_was: medium
    resolution: 'Completion Notes registram o risco aceito do AC 8 com os dois efeitos: preço ao vivo × conteúdo congelado (checkout.ts:84 vs :137-145) e vitrine sem nova moderação. Com razão (AC 8 + escopo) e caminho de fechamento futuro.'
  - id: 'TEST-004'
    severity_was: medium
    resolution: 'Asserções normalizam SQL (comentários removidos, whitespace colapsado) e passaram a ser semânticas: comandos de policy extraídos, tabelas de `store_product_has_history` comparadas como lista ordenada, blocos verificados como statement contíguo, ordem do rollback verificada por posição. Redação da autoavaliação de DoD corrigida para "revisão estática + asserção textual, sem execução em banco".'
    verified_by: 'mutação independente do @qa: remover o guarda deleted_at, remover o índice novo, reintroduzir o índice duplicado, inverter a ordem do rollback e mover a restauração das RPCs para depois do drop derrubam exatamente as asserções correspondentes; reindentar/quebrar linhas não derruba nenhuma.'
  - id: 'DOC-005'
    severity_was: low
    resolution: '`supabase/migrations/20260819100000_training_program_versions_delivery.sql` incluído na File List com a nota de correção arrastada da 1.33.'
  - id: 'PERF-006'
    severity_was: low
    resolution: '`training_program_deliveries_product_idx` criado (era a única das quatro FKs sem índice por product_id) e `store_products_not_deleted_idx` removido por duplicar `store_products_seller_idx`. A avaliação por linha de `store_product_has_history` fica como dívida consciente e justificada — com o índice novo são 4 sondagens de índice por produto.'

