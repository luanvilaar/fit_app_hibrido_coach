  - 'Migration aplicável em transação única no SQL Editor: sem ALTER TYPE ADD VALUE, sem CREATE INDEX CONCURRENTLY.'
  - 'Itens já limpos na iteração 1 permanecem intactos: 5 UPDATEs sem 42P01/42P10, security definer + search_path, cobertura exata das 4 FKs on delete restrict, SELECT ... FOR UPDATE fechando a corrida com o checkout, conversão archived → draft auditada.'
